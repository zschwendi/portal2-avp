name: Portal2AVP
options:
  deploymentTarget:
    visionOS: "2.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    SWIFT_STRICT_CONCURRENCY: complete
    PRODUCT_BUNDLE_IDENTIFIER: dev.zschwendi.portal2avp.renderercheck
    CURRENT_PROJECT_VERSION: 1
    MARKETING_VERSION: "0.1.0"
    CODE_SIGN_STYLE: Automatic
targets:
  Portal2RendererCheck:
    type: application
    platform: visionOS
    sources:
      - path: Sources
      - path: Shaders
      - path: ../runtime/visionos/p2_xr.c
    settings:
      base:
        SWIFT_OBJC_BRIDGING_HEADER: Portal2XR-Bridging-Header.h
        HEADER_SEARCH_PATHS: $(SRCROOT)/../runtime/visionos
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: $(inherited) P2_XR_CALIBRATION
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Portal 2 Renderer Check
        INFOPLIST_KEY_NSWorldSensingUsageDescription: Head tracking places the stereo renderer check around you.
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        TARGETED_DEVICE_FAMILY: 7
    dependencies:
      - sdk: CompositorServices.framework
      - sdk: ARKit.framework
      - sdk: Metal.framework
      - sdk: GameController.framework
schemes:
  Portal2RendererCheck:
    build:
      targets:
        Portal2RendererCheck: all
